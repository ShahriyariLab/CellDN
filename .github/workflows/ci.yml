name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.md"
      - "LICENSE.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.md"
      - "LICENSE.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Avoid storing a second copy of large dependency wheels on the runner.
  PIP_NO_CACHE_DIR: "1"

jobs:
  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # These runners do not need CUDA libraries to run the test suite.
          python -m pip install "torch>=2.4" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install pytest pytest-cov ruff

      - name: Run tests
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          pytest -q

  package:
    name: Build and check package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source distribution and wheel
        run: |
          python -m build

      - name: Check package metadata
        run: |
          python -m twine check dist/*

      - name: Check built wheel import and package resources
        run: |
          python -m venv /tmp/celldn-wheel-test
          source /tmp/celldn-wheel-test/bin/activate
          python -m pip install --upgrade pip
          # Resource helpers import NumPy; model dependencies are tested above.
          python -m pip install "numpy>=1.26,<3"
          python -m pip install --no-deps dist/*.whl

          python - <<'PY'
          import importlib.metadata
          import celldn

          from celldn.normalization.abbreviations import default_abbreviations_path
          from celldn.normalization.ontology import default_ontology_path

          print("CellDN version:", importlib.metadata.version("celldn"))
          print("Package import OK")

          assert default_abbreviations_path().is_file(), default_abbreviations_path()
          assert default_ontology_path().is_file(), default_ontology_path()

          print("Packaged resources OK")
          PY
