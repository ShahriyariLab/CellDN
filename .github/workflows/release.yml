name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify release tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import sys
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_tag = f"v{version}"

          print(f"pyproject.toml version: {version}")
          print(f"release tag: {tag}")

          if tag != expected_tag:
              sys.exit(
                  f"Release tag must match pyproject.toml version. "
                  f"Expected {expected_tag!r}, got {tag!r}."
              )
          PY

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source distribution and wheel
        run: |
          python -m build

      - name: Check package metadata
        run: |
          python -m twine check dist/*

      - name: Check wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"Expected exactly one wheel in dist/, found {len(wheels)}: {wheels}")

          wheel = wheels[0]
          print(f"Checking wheel: {wheel}")

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()

          forbidden_prefixes = (
              ".github/",
              "benchmarks/",
              "checkpoints/",
              "data/",
              "datasets/",
              "docs/",
              "examples/",
              "models/",
              "outputs/",
              "predictions/",
              "tests/",
              "training/",
          )
          forbidden_suffixes = (
              ".bin",
              ".ckpt",
              ".onnx",
              ".pt",
              ".pth",
              ".safetensors",
          )

          bad = [
              name for name in names
              if name.startswith(forbidden_prefixes) or name.endswith(forbidden_suffixes)
          ]
          if bad:
              print("Unexpected files in wheel:")
              for name in bad[:100]:
                  print(f"  {name}")
              sys.exit("Wheel contains files that should not be shipped in release artifacts.")

          has_abbreviation_tsv = any(
              name.startswith("cellexlink/resources/") and name.endswith(".tsv")
              for name in names
          )
          has_ontology_jsonl = any(
              name.startswith("cellexlink/resources/") and name.endswith(".jsonl")
              for name in names
          )

          if not has_abbreviation_tsv:
              sys.exit("Wheel is missing the packaged abbreviation TSV resource.")
          if not has_ontology_jsonl:
              sys.exit("Wheel is missing the packaged ontology JSONL resource.")

          print("Wheel contents look OK.")
          PY

      - name: Install built wheel and check packaged resources
        run: |
          python -m venv /tmp/cellexlink-wheel-test
          source /tmp/cellexlink-wheel-test/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

          python - <<'PY'
          import importlib.metadata
          import cellexlink

          from cellexlink.normalization.abbreviations import default_abbreviations_path
          from cellexlink.normalization.ontology import default_ontology_path

          print("CellExLink version:", importlib.metadata.version("cellexlink"))
          print("Package import OK")

          assert default_abbreviations_path().is_file(), default_abbreviations_path()
          assert default_ontology_path().is_file(), default_ontology_path()

          print("Packaged resources OK")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
