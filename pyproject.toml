[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cellexlink"
version = "0.1.0"
description = "Cell-type recognition and Cell Ontology normalization from biomedical text"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"

authors = [
  { name = "Alimire Nabijiang" }
]

license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]

keywords = [
  "biomedical NLP",
  "named entity recognition",
  "named entity normalization",
  "entity linking",
  "Cell Ontology",
  "cell-type extraction",
  "BioC"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Text Processing :: Linguistic"
]

dependencies = [
  "accelerate>=0.34",
  "datasets>=3.0",
  "huggingface-hub>=0.24",
  "numpy>=1.26,<3",
  "pyab3p>=0.1.1",
  "scipy>=1.11",
  "sentence-transformers>=3.0",
  "torch>=2.4",
  "tqdm>=4.66",
  "transformers>=4.45"
]

[project.urls]
Homepage = "https://github.com/ShahriyariLab/CellExLink"

[project.scripts]
cellexlink = "cellexlink.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cellexlink = [
  "resources/*.tsv",
  "resources/*.jsonl"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "slow: requires downloaded model checkpoints, external services, or GPU resources"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]